<h1>Egg Bread Scramble🍜</h1>
<div class="content">

  <div class="text">
    <ul>
      <b style="color:orange;">Ingredients:</b><br><br>
       <li>1 egg</li>
       <li>1 bread slice</li>
       <li>Salt</li>
       <li>Pepper</li>
       <li>Butter</li>

      <br>
      <b style="color:orange;">Steps:</b><br><br>
      <li>Tear bread into small pieces.</li>
      <li>Melt butter in a pan.</li>
      <li>Add egg and scramble it.</li>
      <li>Add bread pieces and cook together.</li>

    </ul>
