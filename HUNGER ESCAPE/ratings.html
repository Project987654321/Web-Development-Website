  margin: 30px;
  font-size: 25px;
}

.stars {
  cursor: pointer;
  font-size: 35px;
  color: gray;
}

.stars span:hover,
.stars span:hover ~ span {
  color: gray;
}

.active {
  color: gold;
}

.output {
  font-size: 18px;
  margin-top: 10px;
  color: orange;
}
</style>

<script>
document.querySelectorAll(".stars").forEach(starBox => {
  const stars = starBox.querySelectorAll("span");
  const recipeName = starBox.getAttribute("data-recipe");
  const output = document.getElementById(recipeName);

  stars.forEach((star, index) => {
    star.addEventListener("click", () => {
      
      // remove previous selection
      stars.forEach(s => s.classList.remove("active"));

      // add new selection
      for (let i = 0; i <= index; i++) {
        stars[i].classList.add("active");
      }

      // show result
      output.innerText = "You rated " + (index + 1) + " stars ⭐";
    });
  });
});
</script>
