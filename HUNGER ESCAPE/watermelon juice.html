<h1> Watermelon Juice</h1>
<div class="content">

  <div class="text">
    <ul>
      <b style="color:orange;">Ingredients:</b><br><br>
      <li>1 cup watermelon pieces</li>
      <li>½ glass cold water</li>
      <li>Pinch of salt (optional)</li>

      <br>
      <b style="color:orange;">Steps:</b><br><br>
      <li>Mash the watermelon pieces with a spoon.</li>
      <li>Add water and mix well.</li>
      <li>Strain if you want smoother juice.</li>
    </ul>
